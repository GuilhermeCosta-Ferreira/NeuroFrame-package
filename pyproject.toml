[project]
name = "neuroframe"
version = "0.2.0"
description = "NeuroFrame is a package created to facilitate the creation of stereotaxic brain atlas"
authors = [
    {name = "GuilhermeCF",email = "guilheme.henriquesdacostaferreira@epfl.ch"}
]
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "numpy (>=2.2,<2.3)",
    "nibabel (>=5.4.2,<6.0.0)",
    "matplotlib (>=3.10,<3.11)",
    "polars (>=1.42.0,<2.0.0)",
    "tqdm (>=4.68.3,<5.0.0)"

]

[tool.poetry]
packages = [{include = "neuroframe", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


#"simpleitk (>=2.5.3,<3.0.0)",
#"scipy (>=1.16.3,<2.0.0)",
#"opencv-python (>=4.12.0.88,<5.0.0.0)",
#"ipython (>=9.8.0,<10.0.0)",
#"scikit-image (>=0.26.0,<0.27.0)",
#"scikit-learn (>=1.8.0,<2.0.0)",
#"openpyxl (>=3.1.5,<4.0.0)",

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pylint (>=4.0.6,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]

markers = [
    "unit: fast isolated tests",
    "integration: tests involving multiple modules or adapters",
    "e2e: end-to-end pipeline tests",
    "slow: tests that take noticeable time",
    "regression: tests for previously fixed bugs",
    "requires_data: tests that require external/local datasets",
]
